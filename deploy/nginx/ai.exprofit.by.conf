server {
    listen 80;
    listen [::]:80;
    server_name ai.exprofit.by;
    # URLs and Referer headers may contain the webhook capability.
    access_log off;
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ai-consultant-acme;
    }

    location / {
        # Do not put the path (possibly a webhook token) into a redirect Location.
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai.exprofit.by;
    ssl_certificate /etc/letsencrypt/live/ai.exprofit.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.exprofit.by/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # Nginx error messages may include request URLs; use backend/journal for diagnostics.
    error_log /dev/null;
    client_max_body_size 1m;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The JSON administrative API is available only via loopback to Streamlit.
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /health { return 404; }

    # Umnico cannot use panel Basic Auth. The backend verifies the secret path token.
    location ^~ /webhooks/umnico/ {
        auth_basic off;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /webhooks { return 404; }
    location /webhooks/ { return 404; }

    location / {
        auth_basic "AI consultant";
        auth_basic_user_file /etc/nginx/ai-consultant.htpasswd;
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
