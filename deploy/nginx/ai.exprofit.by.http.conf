# Initial HTTP-only site for certificate issuance. Never proxy the panel over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name ai.exprofit.by;
    access_log off;
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ai-consultant-acme;
    }

    location / {
        return 404;
    }
}
