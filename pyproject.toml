[project]
name = "ai-consultant-bot"
version = "0.1.0"
description = "AI consultant bot application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<0.29",
    "loguru>=0.7.3,<0.8",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.34,<1",
]

[project.scripts]
ai-consultant-bot = "ai_consultant_bot.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
